<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neva Duman | Portfolio</title>
    <!-- Google Fonts: Playfair Display for headers, Open Sans for body -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Dark Canvas with Soft Glowing Accents */
            --bg-color: #0d0a14; /* Çok koyu, sıcak alt tonlu bir siyah/mor */
            --card-bg: rgba(30, 25, 40, 0.4); /* Yarı saydam koyu cam efekti */
            --text-main: #f3ecef; /* Yumuşak kırık beyaz */
            --text-secondary: #a8a0b0; /* Uçuk gri/mor */
            --accent-soft: #f4d35e; /* Soft hardal */
            --accent-peach: #f9dcc4; /* Şeftali */
            --border-color: rgba(255, 255, 255, 0.08); /* Çok hafif beyaz sınır */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: var(--bg-color);
            /* Koyu zemin üzerine şeftali ve pembe tonlarında ışık yansımaları (Mesh Gradient) */
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(249, 220, 196, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(242, 213, 215, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(249, 220, 196, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(242, 213, 215, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.8;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            animation: fadeIn 1.2s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
            padding-top: 3rem;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
            text-shadow: 0 4px 15px rgba(249, 220, 196, 0.1);
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        /* Grid Section */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            transition: box-shadow 0.3s ease, transform 0.3s ease, border-color 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border-color: rgba(249, 220, 196, 0.3); /* Hoverda sınır hafifçe şeftali parlar */
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
        }

        .card.edu::before { background-color: var(--accent-peach); box-shadow: 0 0 10px var(--accent-peach); }
        .card.stats::before { background-color: var(--accent-soft); box-shadow: 0 0 10px var(--accent-soft); }

        .card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            margin-bottom: 1.2rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .card h2 span.icon {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .card p {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 400;
        }

        .card strong {
            color: #ffffff; 
            font-weight: 600;
        }

        .github-stats {
            text-align: center;
            margin-top: 1rem;
            display: flex;
            justify-content: center;
        }

        .github-stats img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            opacity: 0.95;
            transition: opacity 0.3s ease;
        }

        .github-stats img:hover {
            opacity: 1;
        }

        .contact-section {
            text-align: center;
            margin-top: 4rem;
            padding: 3.5rem 2rem;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .btn-linkedin {
            display: inline-block;
            background-color: var(--accent-peach);
            color: #0d0a14; /* Koyu metin, butonla kontrast sağlasın diye */
            text-decoration: none;
            padding: 1rem 3rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(249, 220, 196, 0.25);
            border: 2px solid transparent;
        }

        .btn-linkedin:hover {
            background-color: #fce8d5;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(249, 220, 196, 0.4);
        }

        footer {
            margin-top: auto;
            padding: 2rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            width: 100%;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            h1 { font-size: 2.2rem; }
            .grid-container { grid-template-columns: 1fr; }
            .card { padding: 2rem 1.5rem; }
            .contact-section { padding: 2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>Neva Duman</h1>
            <p class="subtitle">Computer Engineering Student</p>
        </header>

        <!-- Cards -->
        <div class="grid-container">
            <section class="card edu">
                <h2><span class="icon">🎓</span> Education</h2>
                <p><strong>Eskişehir Osmangazi University</strong><br>
                Computer Engineering</p>
            </section>

            <section class="card stats">
                <h2><span class="icon">📊</span> GitHub Stats</h2>
                <div class="github-stats">
                    <a href="https://github.com/NevaDmn" target="_blank">
                        <!-- Dark temaya uygun text_color ve title_color ayarlandı -->
                        <img src="https://github-readme-stats.vercel.app/api?username=NevaDmn&show_icons=true&hide_border=true&bg_color=transparent&text_color=f3ecef&icon_color=f9dcc4&title_color=f3ecef" alt="Neva's GitHub stats">
                    </a>
                </div>
            </section>
        </div>

        <!-- Contact Section -->
        <div class="contact-section">
            <p style="color: var(--text-secondary); font-size: 1.1rem;">📫 Want to view my background or get in touch?</p>
            <a href="https://www.linkedin.com/in/neva-duman-a1730a334/" target="_blank" rel="noopener noreferrer" class="btn-linkedin">
                Visit My LinkedIn
            </a>
        </div>
    </div>

    <footer>
        &copy; 2026 Neva Duman. Dark & Soft Portfolio.
    </footer>

</body>
</html>
